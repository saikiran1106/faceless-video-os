name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: pip install -e ".[dev]"
      - run: pytest -q
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck && shellcheck -S warning install.sh
      - name: One-command install + offline demo render
        run: ./install.sh --yes --no-link --demo
      - run: test -s projects/demo-short/08-compose/renders/demo-short_youtube.mp4
