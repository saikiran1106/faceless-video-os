[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceless-forge"
version = "0.1.0"
description = "Agent-driven, plug-and-play pipeline for faceless YouTube/Shorts/Reels: AI voice or your own audio -> transcript -> beats -> keyframes -> captions/overlays -> render -> packaging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.20",
  "Pillow>=10.0",
  "requests>=2.31",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
local-asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]
all = ["playwright>=1.45", "faster-whisper>=1.0", "pytest>=8.0"]

[project.scripts]
faceless = "faceless.cli:main"

[tool.setuptools.packages.find]
include = ["faceless*"]

[tool.setuptools.package-data]
faceless = ["schemas/*.json", "profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
